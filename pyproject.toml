[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riot"
version = "0.3.19"
description = "RIOT — Copilote personnel d'élite, contrôle PC, dev & automatisation multiplateforme."
readme = "README.md"
authors = [
    { name = "Riot" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "ddgs>=9.14.4",
    "fastapi>=0.141.1",
    "mcp>=2.0.0",
    "prompt-toolkit>=3.0.53",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "rich>=14.0.0",
    "segno>=1.6.6",
    "truststore>=0.10.4",
    "uvicorn>=0.34.0",
    "websockets>=17.0.1",
]

[project.optional-dependencies]
voice = [
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "faster-whisper>=1.2.1",
    "onnxruntime>=1.28.0",
    "openwakeword>=0.4.0",
    "piper-tts>=1.3.0",
    "soundcard>=0.4.6",
    "sounddevice>=0.5.5",
]
cuda = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "nvidia-ml-py>=13.610.43",
]
browser = [
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
]
office = [
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.0",
    "pypdf>=6.0.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.0.0",
]
media = [
    "imageio-ffmpeg>=0.6.0",
    "miniaudio>=1.71",
    "numpy>=2.5.1",
    "obsws-python>=1.8.0",
    "scipy>=1.14.0",
]
integrations = [
    "alexapy>=1.30.0",
    "discord-py>=2.7.1",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.1",
    "google-auth-oauthlib>=1.4.0",
    "icalendar>=7.2.2",
    "keyboard>=0.13.5",
    "ollama>=0.6.2",
    "pyngrok>=8.1.2",
    "twilio>=9.10.9",
]
mentor = [
    "google-antigravity>=0.1.24",
]
all = [
    "riot[voice,cuda,browser,office,media,integrations]",
]

[project.scripts]
riot = "riot:main"
riot-cli = "core.cli:main"

[tool.setuptools]
py-modules = ["riot", "keranos", "hud", "overlay"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "tools*", "musique*", "gestes*", "jarvis*", "web*", "data*"]

[tool.setuptools.package-data]
web = ["*.html", "*.css", "*.js", "*.svg", "*.png", "*.json"]
data = ["*.json"]

[tool.uv]
package = true
